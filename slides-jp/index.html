### BH と中性子星の合体: 2 つの結末

<img src="assets/images/tidal_vs_plunge.svg" height="330px">

<div class="highlight-box">

* **ISCO**: この内側では安定に回れず、落ちる一方
* 円盤が残れば、**電磁波でも光る**可能性がある
* 決め手は **質量比・BH の自転・星の大きさ**

</div>

---

### なぜ軽い BH だと壊れるのか

<div class="simple-box">

* 星が壊れ始める距離: $r_{\mathrm{tid}} \sim R_{\mathrm{NS}} (M_{\mathrm{BH}} / M_{\mathrm{NS}})^{1/3}$
* 安定に回れる限界: $r_{\mathrm{ISCO}} = 6 G M_{\mathrm{BH}} / c^2$
* BH を 3.6 → 10 $M_{\odot}$ にすると
  * $r_{\mathrm{ISCO}}$ は 32 → 89 km (**2.8 倍**)
  * $r_{\mathrm{tid}}$ は **1.4 倍**どまり

</div>

<div class="highlight-box">

重い BH は壊す前に飲み込む。**軽い BH ほど、外で壊せる**

</div>

<small>※ 自転していない BH の場合の、桁の見積り</small>

### 追試する計算

<div class="simple-box">

* **Einstein Toolkit** 公式ギャラリーの例題
  * Matur et al. (2026), [arXiv:2603.07374](https://arxiv.org/abs/2603.07374)
* BH 3.6 $M_{\odot}$ + 中性子星 1.4 $M_{\odot}$、自転なし
* **44 km** 離れた位置から、**約 1.5 周**で合体
* 設定・初期データ・結果が**すべて公開**

</div>

<div class="highlight-box">

同じ設定を**別の計算機で**回して、答えを比べる

</div>

### 前回との違い: 物質が入る

<div class="simple-box">

* 前回 (BH + BH) は**真空**。今回は物質がある
  $$ G_{\mu\nu} = \frac{8 \pi G}{c^4} T_{\mu\nu} $$
* 時空と**相対論的な流体**を同時に解く
  * 時空: ML_CCZ4、流体: IllinoisGRMHD
* 星の中身は単純なモデル ($P = K \rho^{\Gamma}$, $\Gamma = 2$)
* 真空は、ごく薄い「**人工の大気**」で埋める

</div>

---

### 再開した計算だけ 3 倍遅い

* 最初からの計算は 1 ステップ **4.16 秒**

  * 読み戻した 162 GiB が片側のメモリを占領

  * 引かずに割ると 19% に見える
