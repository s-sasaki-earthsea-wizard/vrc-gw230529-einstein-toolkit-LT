### GW230529 とは？

<div class="simple-box">

* **2023 年 5 月 29 日**に検出された重力波
* 観測できたのは **LIGO Livingston の 1 台だけ**
  * 到来方向が絞れず、光では見つかっていない
* 2 天体の質量 (90% 信用区間)
  * **2.5〜4.5 $M_{\odot}$** と **1.2〜2.0 $M_{\odot}$**
* 最有力の解釈: **軽い BH + 中性子星**

</div>

<small>LIGO-Virgo-KAGRA, Astrophys. J. Lett. 970, L34 (2024)</small>

### BH と中性子星の合体: 2 つの結末

<img src="assets/images/tidal_vs_plunge.svg" height="330px">

<div class="highlight-box">

* **ISCO**: この内側では安定に回れず、落ちる一方
* 円盤が残れば、**電磁波でも光る**可能性がある
  * 地球を回り続ける人工衛星のイメージ
* 決め手は **質量比・BH の自転・星の大きさ**

</div>

---

### ISCO: 人工衛星の直感が破れる

<div class="container">
<div class="col-box-left">

**人工衛星 (ニュートン)**

* 重力と遠心力の釣り合いで回る
* 速さを合わせれば、**どの高さでも**回れる
* 少しずれても、楕円軌道になるだけ

</div>

<div class="col-box-right">

**BH のそば (一般相対論)**

* 回る仕組みは同じ
* 近づくと重力が逆 2 乗より**急に強まる**
* ISCO より内側には**安定な円軌道が無い** → 落ちていく

</div>
</div>

<br>

<div class="highlight-box">

* ISCO の半径は BH の**質量に比例**する
  * 3.6 $M_{\odot}$ なら 32 km

</div>

---

### なぜ軽い BH だと壊れるのか

<div class="simple-box">

* **潮汐力**: 星の手前と奥で、BH の引力の強さが違う
  * 星を引き伸ばす力。地球の潮の満ち引きと同じ
  * 距離の **3 乗**で弱まる
* BH を 3.6 → 10 $M_{\odot}$ (2.8 倍) にすると
  * 星が壊れる距離: 2.8 の 3 乗根 = **1.4 倍**
  * ISCO: 質量に比例して **2.8 倍**

</div>

<br>

<div class="highlight-box">

* 重い BH は壊す前に ISCO の内側で飲み込まれる
* 軽い BH は外で壊し、破片は回り続けて円盤に

</div>

<small>※ 自転していない BH の場合の、桁の見積り。式は Appendix D</small>

* **44 km** 離れた位置から、**約 1.5 周**で合体

### 前回との違い: 物質が入る

<div class="simple-box">

* **BH** は実は**質量と自転だけ**で決まるシンプルな天体
  * 前回 (BH + BH) は**時空のゆがみだけ**を計算
* **中性子星**は物質のかたまり → **物質の流れ**も同時に計算
  * 時空が物質を動かし、物質が時空をゆがめる
* 本物の中性子星では**流体の力と電磁気力**の両方が効く (磁気流体)

</div>

<br>

<div class="highlight-box">

* 今回の計算は簡単のため電磁場なしで流体力だけ

</div>

---

### 星の中身と、星の外

<div class="simple-box">

* **中身**: いちばん単純なモデル (ポリトロープ)
  * 圧力は密度の 2 乗に比例
  * 本物の中性子星の中身は、まだよく分かっていない
* **外**: 真空を**ごく薄い人工の大気**で埋める
  * 流体の計算は密度ゼロ (真空) を扱えないため
  * 物理ではなく**計算の都合**。濃さは星の中心より 7 桁薄い
  * 薄くても領域が広いので、集めると 0.25 $M_{\odot}$
  * 残った物質を数えるときに差し引く

</div>

## 自宅 PC からクラウドへ
### 止められる計算機を使いこなす

### 自宅 PC で解像度を落として試走

<div class="simple-box">

* 自宅 PC: **16 コア / メモリ 93 GiB**
* フル解像度に必要なメモリ: **約 137 GiB** → ❌
* 解像度を落とせば載る (最細 222 m → 323 m)
  * 4.4 ミリ秒 (合体の少し後) までの計算に **4.8 日**
  * それでも星が崩れていく時刻は参照と**ほぼ同じ** (ずれ 0.01 ミリ秒ほど)
* 粗くても合った。でもこのままでは前回 (BH + BH) の焼き直し

</div>

<br>

<div class="highlight-box">

* 自宅で**粗く検証**、本番は**クラウドでフル解像度で**

</div>

---

### クラウドで計算機を借りる

<div class="simple-box">

* クラウド (AWS, Amazon Web Services) は計算機を**時間貸し**する
* 借りたのは **192 コア / メモリ 384 GiB 以上**を 1 台
* 通常料金なら 31 時間で**約 305 USD** (試算)
* **スポットインスタンス**なら半額以下
  * 誰も使っていない計算機を安く借りる仕組み
  * 代償: **2 分前の予告で止められる**

</div>

<br>

<div class="highlight-box">

* 中断されても再開できる仕組みが必要
* その仕組みさえ用意できれば**安く計算できる**

</div>

## トラブル集
### 止められる計算機ならではの話

---

### 初日: 5 台続けて止められる

<div class="simple-box">

* 初日、5 台続けて **10〜28 分**で止められた
  * **3 時間 46 分**、進捗ゼロ
* **別の機種**には空きがあった → 切り替えて安定
* 中断は**米国西海岸(今回利用したマシンの所在地)のオフィスアワー**に集中
  * 機種の切り替えと重なり、原因は切り分け不能

</div>

<br>

<div class="highlight-box">

この 3 時間 46 分は**請求もゼロ**だった

</div>

<small>※ スポットインスタンスは開始 1 時間以内にAWS側の都合で止められた分は課金されない</small>

---

### 再開した計算だけ 3 倍遅い

<div class="simple-box">

* 最初からの計算は 1 ステップ **4.16 秒**
* 再開した計算は **12.36 秒**
  * CPU は全コア 100%。それなのに遅い
* 原因は**メモリの置き場所**
  * 読み戻した 162 GiB が片側のメモリを占領
* キャッシュを捨てる **1 行**で解決
* 答えは同じでも、**時間も費用も 3 倍**になるところ

</div>

<br>

<div class="highlight-box">

* 大きなデータを読み戻してから計算を始めるなら、**分野を問わず起こりうる**

</div>

---

### 今回の構成の利点と弱点

<div class="simple-box">

* **利点**
  * なんと言っても安い
    * 複数回計算できたり、少ない予算でも大きな計算ができる
  * 中断と再開を前提とした構成はローカルマシンでの計算でも有用なはず
* **弱点**
  * いつ終わるかわからない、ETAが読めない
  * 納期がタイトだったり、速報性が求められる計算には不向き

</div>

---

### 今回の成果の応用性

<div class="simple-box">

* 中断・再開の仕組みに、**数値相対論に固有の物理は無い**
* 同じやり方が使える条件は 3 つ
  * 途中経過から**再開できる** (いちばん大事)
  * 計算機 **1 台に載る**
  * 途中経過を**外部ストレージに送れる**
* 流体 (天気・流れ) や構造 (建物の強度) の計算にも使えるはず
  * ただし、まだ試してはいない

</div>

<br>

<div class="highlight-box">

* 再開できる計算なら、分野を問わず「安く回す」選択肢になる

</div>

### Appendix D: 潮汐破壊と ISCO

<div class="simple-box" style="font-size: 0.7em;">

* 星が壊れる距離: 星の表面で、潮汐力が自己重力に勝つところ
  $$ \frac{2 G M_{\mathrm{BH}} R_{\mathrm{NS}}}{r^3} \sim \frac{G M_{\mathrm{NS}}}{R_{\mathrm{NS}}^2} \quad \Rightarrow \quad r_{\mathrm{tid}} \sim R_{\mathrm{NS}} (2 M_{\mathrm{BH}} / M_{\mathrm{NS}})^{1/3} $$
* 自転しない BH の有効ポテンシャル (単位質量あたり、$L$: 角運動量)
  $$ V_{\mathrm{eff}}(r) = -\frac{G M_{\mathrm{BH}}}{r} + \frac{L^2}{2 r^2} - \frac{G M_{\mathrm{BH}} L^2}{c^2 r^3} $$
  * 第 3 項が一般相対論の補正 (逆 2 乗より強い引力)
  * 安定な円軌道は $r \geq 6 G M_{\mathrm{BH}} / c^2$ に限られる (ISCO)

</div>

<br>

<div class="highlight-box" style="font-size: 0.7em;">

$r_{\mathrm{tid}} \propto M_{\mathrm{BH}}^{1/3}$、$r_{\mathrm{ISCO}} \propto M_{\mathrm{BH}}$。係数はモデル依存なので、比だけを使う

</div>
