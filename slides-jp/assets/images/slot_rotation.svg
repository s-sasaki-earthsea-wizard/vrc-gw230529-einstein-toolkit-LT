<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
  <!-- Two checkpoint slots over four moments. The CURRENT label moves only
       after every file of a push has landed, so a push cut short by an
       interruption can only damage the slot CURRENT does not name. -->
  <defs>
    <pattern id="torn" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fdf3ec"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e9b08a" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="380" rx="16" fill="#ffffff"/>

  <!-- Row labels -->
  <text x="28" y="137" font-size="18" fill="#222" font-weight="bold">置き場 A</text>
  <text x="28" y="227" font-size="18" fill="#222" font-weight="bold">置き場 B</text>

  <!-- Column headers -->
  <g font-size="17" fill="#222" text-anchor="middle">
    <text x="215" y="40" font-weight="bold">① 送り終えた</text>
    <text x="395" y="40" font-weight="bold">② 次は B へ</text>
    <text x="575" y="40" font-weight="bold">③ A へ送信中に中断</text>
    <text x="775" y="40" font-weight="bold">④ 次の計算機</text>
  </g>
  <g font-size="14" fill="#666" text-anchor="middle">
    <text x="215" y="62">ラベルは A</text>
    <text x="395" y="62">届いたらラベルを移す</text>
    <text x="575" y="62">ラベルは B のまま</text>
    <text x="775" y="62">ラベルの指す B から再開</text>
  </g>

  <!-- Column separators -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="305" y1="28" x2="305" y2="280"/>
    <line x1="485" y1="28" x2="485" y2="280"/>
    <line x1="675" y1="28" x2="675" y2="280"/>
  </g>

  <!-- ① A = gen 1 complete (CURRENT), B = empty -->
  <rect x="140" y="100" width="150" height="60" rx="8" fill="#eaf6f1" stroke="#009E73" stroke-width="2.5"/>
  <text x="215" y="137" font-size="17" fill="#222" text-anchor="middle">世代 1 (完成)</text>
  <rect x="140" y="190" width="150" height="60" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="215" y="227" font-size="17" fill="#999" text-anchor="middle">空</text>

  <!-- ② A = gen 1, B = gen 2 complete (CURRENT) -->
  <rect x="320" y="100" width="150" height="60" rx="8" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="395" y="137" font-size="17" fill="#222" text-anchor="middle">世代 1 (完成)</text>
  <rect x="320" y="190" width="150" height="60" rx="8" fill="#eaf6f1" stroke="#009E73" stroke-width="2.5"/>
  <text x="395" y="227" font-size="17" fill="#222" text-anchor="middle">世代 2 (完成)</text>

  <!-- ③ A = torn, B = gen 2 complete (CURRENT) -->
  <rect x="500" y="100" width="160" height="60" rx="8" fill="url(#torn)" stroke="#D55E00" stroke-width="2.5"/>
  <text x="580" y="137" font-size="17" fill="#222" text-anchor="middle">世代 3 (書きかけ)</text>
  <rect x="500" y="190" width="160" height="60" rx="8" fill="#eaf6f1" stroke="#009E73" stroke-width="2.5"/>
  <text x="580" y="227" font-size="17" fill="#222" text-anchor="middle">世代 2 (完成)</text>

  <!-- ④ A = torn, to be overwritten; B = gen 2, read back -->
  <rect x="695" y="100" width="170" height="60" rx="8" fill="url(#torn)" stroke="#cccccc" stroke-width="1.5"/>
  <text x="780" y="130" font-size="16" fill="#222" text-anchor="middle">読まれない</text>
  <text x="780" y="150" font-size="14" fill="#666" text-anchor="middle">次の転送で上書き</text>
  <rect x="695" y="190" width="170" height="60" rx="8" fill="#eaf6f1" stroke="#009E73" stroke-width="2.5"/>
  <text x="780" y="227" font-size="17" fill="#222" text-anchor="middle">世代 2 から再開</text>

  <!-- CURRENT labels: a tag on the slot it names -->
  <g font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="176" y="88" width="78" height="22" rx="11" fill="#009E73"/>
    <text x="215" y="104">CURRENT</text>
    <rect x="356" y="178" width="78" height="22" rx="11" fill="#009E73"/>
    <text x="395" y="194">CURRENT</text>
    <rect x="541" y="178" width="78" height="22" rx="11" fill="#009E73"/>
    <text x="580" y="194">CURRENT</text>
    <rect x="741" y="178" width="78" height="22" rx="11" fill="#009E73"/>
    <text x="780" y="194">CURRENT</text>
  </g>

  <!-- Takeaway -->
  <line x1="60" y1="296" x2="840" y2="296" stroke="#e5e5e5" stroke-width="1"/>
  <text x="450" y="330" font-size="19" fill="#222" text-anchor="middle">壊れるのは、いつも「ラベルが指していない側」だけ</text>
  <text x="450" y="358" font-size="15" fill="#666" text-anchor="middle">置き場がひとつだと、上書きの途中で止められたとき戻る先が無くなる</text>
</svg>
